name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # Must match the folder under Packages/. Upstream left this as com.vrchat.UdonSharp,
  # which has not existed since the package was renamed -- every run died on "get version".
  packageName: "com.merlin.UdonSharp"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@7c8cf5cc36eb85d8d287a8086a39dac59628eb31
        with:
          path: "Packages/${{ env.packageName }}/package.json"
          prop_path: "version"

      - name: Set environment variables
        run: echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.prop }}.zip" >> $GITHUB_ENV

      - name: Create zip
        uses: thedoctor0/zip-release@09336613be18a8208dfa66bd57efafd9e2685657
        with:
          type: "zip"
          directory: "Packages/${{ env.packageName }}/"
          filename: "../../${{ env.zipFile }}" # two directories up, since we start two directories in

      # The .unitypackage upload was removed: nothing in this workflow builds one, so
      # action-gh-release was being handed a file that never existed.
      - name: Make release
        uses: softprops/action-gh-release@1e07f4398721186383de40550babbdf2b84acfc5
        with:
          tag_name: ${{ steps.version.outputs.prop }}
          files: |
            ${{ env.zipFile }}
            Packages/${{ env.packageName }}/package.json
