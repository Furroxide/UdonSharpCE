name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # Must match the folder under Packages/. Upstream left this as com.vrchat.UdonSharp,
  # which has not existed since the package was renamed -- every run died on "get version".
  packageName: "com.merlin.UdonSharp"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@7c8cf5cc36eb85d8d287a8086a39dac59628eb31
        with:
          path: "Packages/${{ env.packageName }}/package.json"
          prop_path: "version"

      # Tags in this repo are v-prefixed (v0.9.1, v1.2.0-b1) and the workflow triggers on "v*", but the
      # release used to be created under the bare version. action-gh-release creates a missing tag at
      # the default branch's HEAD, so pushing v1.2.0 produced a second tag "1.2.0" that could point at
      # a different commit than the one that was tagged. Use the v-prefixed name everywhere, and refuse
      # a pushed tag that disagrees with package.json rather than publishing a mislabelled zip.
      - name: Resolve release tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.prop }}
        run: |
          expected="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Pushed tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected ${expected})"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${expected}"; then
            tagged_commit=$(git rev-parse "${expected}^{commit}")
            if [ "${tagged_commit}" != "${GITHUB_SHA}" ]; then
              echo "::error::Existing tag ${expected} points to ${tagged_commit}, not the commit being packaged (${GITHUB_SHA})"
              exit 1
            fi
          fi
          echo "name=${expected}" >> "$GITHUB_OUTPUT"

      - name: Set environment variables
        run: echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.prop }}.zip" >> $GITHUB_ENV

      - name: Create zip
        uses: thedoctor0/zip-release@09336613be18a8208dfa66bd57efafd9e2685657
        with:
          type: "zip"
          directory: "Packages/${{ env.packageName }}/"
          filename: "../../${{ env.zipFile }}" # two directories up, since we start two directories in

      # The .unitypackage upload was removed: nothing in this workflow builds one, so
      # action-gh-release was being handed a file that never existed.
      - name: Make release
        uses: softprops/action-gh-release@1e07f4398721186383de40550babbdf2b84acfc5
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # Only consulted when the tag does not exist yet (a manual workflow_dispatch run): tag the
          # commit that was actually zipped instead of whatever the default branch points at by then.
          target_commitish: ${{ github.sha }}
          # 1.2.0-b1 and friends are semver prereleases; VCC hides them unless the user opts in.
          prerelease: ${{ contains(steps.version.outputs.prop, '-') }}
          files: |
            ${{ env.zipFile }}
            Packages/${{ env.packageName }}/package.json
